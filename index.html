<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, initial-scale=0.35, maximum-scale=2.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vyapar">
  <meta name="description" content="Vyapar - Business Accounting, GST Invoice, Inventory & Payment Management App for Small Business">
  <meta name="keywords" content="vyapar, business, accounting, GST, invoice, inventory, billing, payments">
  <meta name="author" content="Vyapar Business App">

  <title>Vyapar - Business Accounting App</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <!-- App Root -->
  <div id="app">
    <!-- Loading State -->
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px">
      <img src="assets/icons/icon-192.png" alt="Vyapar" style="width:80px;height:80px;border-radius:16px;animation:pulse 1.5s infinite">
      <h2 style="font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Vyapar</h2>
      <p style="color:#64748b;font-size:0.85rem">Loading...</p>
    </div>
  </div>

  <!-- Firebase SDK (CDN — Compat mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts (order matters) -->
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/accounts.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/parties.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
